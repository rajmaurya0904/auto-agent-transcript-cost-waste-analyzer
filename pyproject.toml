[project]
name = "auto-agent-transcript-cost-waste-analyzer"
version = "0.1.0"
description = "CLI that parses local Claude Code / Codex session JSONL transcripts and reports token spend per tool, repeated file re-reads, oversized tool outputs and cache misses, with concrete suggestions. For heavy agent users who don't know where their tokens go."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
